#
# Run flashed firmware after OpenOCD flash (SW_RESET equivalent over JTAG).
# OpenOCD "reset run" only clears JTAG CPU halt; this triggers a full chip reset
# and releases debug halt so the app boots normally.

proc esp32c5_app_run { } {
	global _RISCV_DMCONTROL _RISCV_SB_CS _RISCV_SB_ADDR0 _RISCV_SB_DATA0

	echo "** System reset for app run **"

	# LP_AON software reset (same registers as esp32c5_soc_reset, without re-holding halt).
	riscv dmi_write $_RISCV_SB_CS     0x48000
	riscv dmi_write $_RISCV_SB_ADDR0  0x600b1034
	riscv dmi_write $_RISCV_SB_DATA0 0x80000000

	riscv dmi_write $_RISCV_SB_CS     0x48000
	riscv dmi_write $_RISCV_SB_ADDR0 0x600b1038
	riscv dmi_write $_RISCV_SB_DATA0 0x10000000

	sleep 20
	poll

	esp32c5_wdt_disable

	# Clear any debug halt left over from flash; do not resume (core runs after soc reset).
	foreach t [target names] {
		$t riscv dmi_write $_RISCV_DMCONTROL 0x40000001
	}

	sleep 50
	echo "** App run **"
}
