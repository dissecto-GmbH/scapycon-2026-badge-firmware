# Build ESP32-C5 badge firmware (OTA update + full factory image) and publish
# GitHub Releases on version tags.
#
# Create a release:
#   git tag v1.1.0 && git push origin v1.1.0

name: Firmware

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      project_ver:
        description: "Optional PROJECT_VER override (default: UTC timestamp or tag)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.0.2
      options: --user root
    outputs:
      project_ver: ${{ steps.ver.outputs.value }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve PROJECT_VER
        id: ver
        shell: bash
        run: |
          set -eo pipefail
          if [[ -n "${{ inputs.project_ver }}" ]]; then
            VER="${{ inputs.project_ver }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            VER="$(date -u +%Y.%m.%d.%H.%M.%S)"
          fi
          echo "value=${VER}" >> "$GITHUB_OUTPUT"
          echo "PROJECT_VER=${VER}"

      - name: Build OTA + factory image
        shell: bash
        env:
          PROJECT_VER: ${{ steps.ver.outputs.value }}
        run: |
          set -eo pipefail
          echo "PWD=$(pwd)"
          echo "IDF_PATH=${IDF_PATH:-unset}"
          ls -la tools/ci_build_release.sh
          file tools/ci_build_release.sh || true
          # export.sh is incompatible with nounset
          set +u
          . "${IDF_PATH}/export.sh"
          set -u
          echo "IDF_PYTHON_ENV_PATH=${IDF_PYTHON_ENV_PATH:-}"
          python3 "${IDF_PATH}/tools/idf.py" --help >/dev/null
          bash -x tools/ci_build_release.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: badge-firmware
          path: |
            build/release/firmware.bin
            build/release/firmware.ver
            build/release/factory_flash.bin
            build/release/SHA256SUMS
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: badge-firmware
          path: release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Badge firmware ${{ needs.build.outputs.project_ver }}
          body: |
            Scapycon 2026 ESP32-C5 badge firmware **${{ needs.build.outputs.project_ver }}**
            (ESP-IDF v6.0.2).

            | Asset | Use |
            |-------|-----|
            | `firmware.bin` + `firmware.ver` | OTA (flashloader / update server) |
            | `factory_flash.bin` | Full 4 MiB factory image @ flash offset `0x0` |

            ```bash
            # Factory flash (download mode: hold SW_BOOT + reset)
            esptool.py --chip esp32c5 -p PORT write_flash 0x0 factory_flash.bin
            ```

            Built from `${{ github.sha }}`.
          files: |
            release/firmware.bin
            release/firmware.ver
            release/factory_flash.bin
            release/SHA256SUMS
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
